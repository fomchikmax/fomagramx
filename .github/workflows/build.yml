name: Build FomagramX (Telegram X)

on:
  workflow_dispatch:
    inputs:
      build_arm64:
        description: 'Собрать ARM64 (arm64-v8a)'
        type: boolean
        default: true
      build_arm32:
        description: 'Собрать Lollipop ARM32 (Android 5.0+, armeabi-v7a)'
        type: boolean
        default: true
      build_universal:
        description: 'Собрать Universal (все архитектуры)'
        type: boolean
        default: false
      build_type:
        description: 'Тип сборки (Release или Debug)'
        type: choice
        options:
          - 'release'
          - 'debug'
        default: 'release'
      sign_apk:
        description: 'Автоматически подписать APK (чтобы сразу ставился на девайс)'
        type: boolean
        default: true

jobs:
  prepare:
    name: Select Architectures
    runs-on: ubuntu-latest
    outputs:
      flavors: ${{ steps.set-flavors.outputs.flavors }}
    steps:
      - id: set-flavors
        run: |
          FLAVORS=()
          if [ "${{ github.event.inputs.build_arm64 }}" = "true" ]; then
            FLAVORS+=("arm64")
          fi
          if [ "${{ github.event.inputs.build_arm32 }}" = "true" ]; then
            FLAVORS+=("arm32")
          fi
          if [ "${{ github.event.inputs.build_universal }}" = "true" ]; then
            FLAVORS+=("universal")
          fi

          if [ ${#FLAVORS[@]} -eq 0 ]; then
            echo "No architectures selected, falling back to arm64 and arm32"
            FLAVORS+=("arm64" "arm32")
          fi

          JSON_ARRAY=$(jq -c -n '$ARGS.positional' --args "${FLAVORS[@]}")
          echo "Selected flavors: $JSON_ARRAY"
          echo "flavors=$JSON_ARRAY" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.flavor }} APK
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJson(needs.prepare.outputs.flavors) }}
    env:
      TERM: xterm-256color
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Free disk space on runner
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Fix line endings and script permissions
        run: |
          find scripts -type f -exec sed -i 's/\r$//' {} + 2>/dev/null || true
          sed -i 's/\r$//' version.properties local.properties.sample gradlew 2>/dev/null || true
          chmod -R +x scripts gradlew

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm libncurses6 git-lfs
          git lfs install

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK & NDK
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export CMAKE_VERSION=$(bash scripts/read-property.sh version.properties version.cmake | tr -d '\r')
          export NDK_VERSION=$(bash scripts/read-property.sh version.properties version.ndk_primary | tr -d '\r')
          export BUILD_TOOLS_VERSION=$(bash scripts/read-property.sh version.properties version.build_tools | tr -d '\r')
          export COMPILE_SDK_VERSION=$(bash scripts/read-property.sh version.properties version.sdk_compile | tr -d '\r')

          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ] || [ ! -d "$ANDROID_HOME/cmake/$CMAKE_VERSION" ]; then
            echo "Installing Android SDK packages: Platform $COMPILE_SDK_VERSION, Build-Tools $BUILD_TOOLS_VERSION, NDK $NDK_VERSION, CMake $CMAKE_VERSION"
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
              "platforms;android-$COMPILE_SDK_VERSION" \
              "build-tools;$BUILD_TOOLS_VERSION" \
              "ndk;$NDK_VERSION" \
              "cmake;$CMAKE_VERSION"
          else
            echo "Android NDK ($NDK_VERSION) and CMake ($CMAKE_VERSION) are already available."
          fi

          # Fix NDK yasm if missing
          PREBUILT="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64"
          if [ -d "$PREBUILT/bin" ] && [ ! -f "$PREBUILT/bin/yasm" ]; then
            sudo ln -sf $(which yasm) "$PREBUILT/bin/yasm"
          fi

          # Fix clang folder naming if needed
          CLANG_DIR=$(ls -d $PREBUILT/lib64/clang/*/lib/linux 2>/dev/null | head -n 1 | xargs -r dirname | xargs -r dirname)
          if [ -n "$CLANG_DIR" ] && [ ! -d "$PREBUILT/lib64/clang/12.0.9" ]; then
            sudo ln -sf "$CLANG_DIR" "$PREBUILT/lib64/clang/12.0.9"
          fi

      - name: Restore Git Submodules
        id: restore-submodules
        uses: actions/cache/restore@v4
        with:
          path: |
            app/jni/third_party
            tdlib
            vkryl
            thirdparty
          key: submodules-${{ runner.os }}-${{ hashFiles('.gitmodules') }}
          restore-keys: |
            submodules-${{ runner.os }}-

      - name: Clone and sync all git submodules
        if: steps.restore-submodules.outputs.cache-hit != 'true'
        run: |
          python3 scripts/sync-submodules.py

      - name: Save Git Submodules to Cache
        if: steps.restore-submodules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app/jni/third_party
            tdlib
            vkryl
            thirdparty
          key: submodules-${{ runner.os }}-${{ hashFiles('.gitmodules') }}

      - name: Restore Native Compiled Libraries
        id: restore-native
        uses: actions/cache/restore@v4
        with:
          path: |
            app/jni/third_party/libvpx/build
            app/jni/third_party/ffmpeg/build
            app/jni/third_party/androidx-media
            app/jni/third_party/opus
          key: native-libs-${{ runner.os }}-${{ hashFiles('.gitmodules', 'scripts/private/**') }}
          restore-keys: |
            native-libs-${{ runner.os }}-

      - name: Setup local.properties and Keystore
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SIGN_APK: ${{ github.event.inputs.sign_apk }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::TELEGRAM_API_ID или TELEGRAM_API_HASH пустые в GitHub Secrets! Сохрани их в Settings -> Secrets (TELEGRAM_API_ID, TELEGRAM_API_HASH)."
            exit 1
          fi

          SIGN_APK="${SIGN_APK:-true}"
          KEYSTORE_FILE=""
          if [ "$SIGN_APK" = "true" ]; then
            if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
              echo "Using keystore from RELEASE_KEYSTORE_BASE64 secret..."
              echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
            elif [ -n "${{ secrets.SIGNING_KEYSTORE }}" ]; then
              echo "Using keystore from SIGNING_KEYSTORE secret..."
              echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > "$RUNNER_TEMP/release.jks"
            else
              echo "No secret keystore found. Generating a keystore on the fly..."
              keytool -genkeypair -v \
                -keystore "$RUNNER_TEMP/release.jks" \
                -alias fomagramx \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass "fomagramxpass" \
                -keypass "fomagramxpass" \
                -dname "CN=FomagramX, OU=TGX, O=Fomchik, L=Moscow, S=Moscow, C=RU"
            fi

            printf "keystore.file=%s\nkeystore.password=fomagramxpass\nkey.alias=fomagramx\nkey.password=fomagramxpass\n" "$RUNNER_TEMP/release.jks" > "$RUNNER_TEMP/keystore.properties"
            KEYSTORE_FILE="$RUNNER_TEMP/keystore.properties"
          fi

          printf "sdk.dir=%s\napp.id=org.fomchik.fomagramx\napp.name=Fomagram X\napp.download_url=https://telegram.org/dlx\ntelegram.api_id=%s\ntelegram.api_hash=%s\n" "$ANDROID_HOME" "$API_ID" "$API_HASH" > local.properties

          if [ -n "$KEYSTORE_FILE" ]; then
            echo "keystore.file=$KEYSTORE_FILE" >> local.properties
          else
            echo "app.disable_signing=true" >> local.properties
          fi

          echo "local.properties successfully created."

      - name: Build native dependencies (libvpx, ffmpeg, opus, androidx-media)
        if: steps.restore-native.outputs.cache-hit != 'true'
        run: |
          chmod -R +x scripts gradlew
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export TERM=xterm-256color
          bash scripts/setup.sh --skip-sdk-setup

      - name: Save Native Compiled Libraries to Cache
        if: steps.restore-native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app/jni/third_party/libvpx/build
            app/jni/third_party/ffmpeg/build
            app/jni/third_party/androidx-media
            app/jni/third_party/opus
          key: native-libs-${{ runner.os }}-${{ hashFiles('.gitmodules', 'scripts/private/**') }}

      - name: Build APK via Gradle
        env:
          FLAVOR: ${{ matrix.flavor }}
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          BUILD_TYPE_CAP="$(tr '[:lower:]' '[:upper:]' <<< ${BUILD_TYPE:0:1})${BUILD_TYPE:1}"

          case "$FLAVOR" in
            universal)
              TASK="assembleLatestUniversal${BUILD_TYPE_CAP}"
              ;;
            arm64)
              TASK="assembleLatestArm64${BUILD_TYPE_CAP}"
              ;;
            arm32)
              TASK="assembleLollipopArm32${BUILD_TYPE_CAP}"
              ;;
            x64)
              TASK="assembleLatestX64${BUILD_TYPE_CAP}"
              ;;
            x86)
              TASK="assembleLatestX86${BUILD_TYPE_CAP}"
              ;;
            *)
              TASK="assembleLatestUniversal${BUILD_TYPE_CAP}"
              ;;
          esac

          echo "Building $FLAVOR with task: ./gradlew $TASK"
          ./gradlew $TASK --stacktrace --no-daemon

      - name: Verify, Sign and Prepare APKs
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          echo "Using apksigner: $APKSIGNER"
          
          mkdir -p dist
          for apk in $(find app/build/outputs/apk -name "*.apk" -type f); do
            echo "Checking APK: $apk"
            if ! $APKSIGNER verify "$apk" 2>/dev/null; then
              echo "APK $apk is not signed or verification failed! Signing with apksigner..."
              $APKSIGNER sign --ks "$RUNNER_TEMP/release.jks" --ks-pass pass:fomagramxpass --key-pass pass:fomagramxpass --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "$apk"
            fi
            echo "Signature verification for $apk:"
            $APKSIGNER verify -v "$apk" || true

            if [ "${{ matrix.flavor }}" = "arm32" ]; then
              TARGET_NAME="fomagramx-lollipop-arm32-${BUILD_TYPE}.apk"
            else
              TARGET_NAME="fomagramx-${{ matrix.flavor }}-${BUILD_TYPE}.apk"
            fi
            cp "$apk" "dist/${TARGET_NAME}"
            echo "Copied $apk -> dist/${TARGET_NAME}"
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fomagramx-${{ matrix.flavor == 'arm32' && 'lollipop-arm32' || matrix.flavor }}-${{ github.event.inputs.build_type || 'release' }}-apk
          path: dist/*.apk
          retention-days: 14
